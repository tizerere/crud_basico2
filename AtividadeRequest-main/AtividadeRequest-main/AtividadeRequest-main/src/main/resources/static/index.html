<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca | Início</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand">Biblioteca<span>+</span></div><nav class="nav"><a class="active" href="/">🏠 Início</a><a href="/alunos.html">👤 Alunos</a><a href="/livros.html">📚 Livros</a><a href="/emprestimos.html">🔄 Empréstimos</a></nav></aside><main class="main"><div class="top"><h1>Painel da Biblioteca</h1><div class="muted">Visão geral do sistema</div></div><section class="cards"><div class="card"><div class="muted">Alunos cadastrados</div><div class="number" id="nAlunos">—</div></div><div class="card"><div class="muted">Livros cadastrados</div><div class="number" id="nLivros">—</div></div><div class="card"><div class="muted">Empréstimos ativos</div><div class="number" id="nEmprestimos">—</div></div></section><section class="panel"><h2>Bem-vindo 👋</h2><p class="muted">Use o menu para cadastrar alunos, livros e controlar empréstimos e devoluções.</p><div id="msg"></div></section></main></div><script src="/js/common.js"></script><script>Promise.all([api('/alunos'),api('/livros'),api('/emprestimos')]).then(([a,l,e])=>{nAlunos.textContent=a.length;nLivros.textContent=l.length;nEmprestimos.textContent=e.filter(x=>!x.dataDevolucao).length}).catch(()=>msg('Não foi possível carregar os dados.',false))</script></body></html>
